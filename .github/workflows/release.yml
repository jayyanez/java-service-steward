name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      sign:
        description: "Request one Azure signature for a validation build (never publishes a release)"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    if: github.event_name == 'push'
    name: Build and publish
    runs-on: windows-latest
    environment: release-signing
    env:
      WINDOWS_RELEASE_SIGNING: ${{ github.repository == 'jayyanez/java-service-steward' && vars.WINDOWS_CODE_SIGNING_ENABLED != '0' }}
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Check that the tag matches the Cargo version
        id: version
        shell: pwsh
        run: |
          $cargoToml = Get-Content -LiteralPath Cargo.toml -Raw
          $match = [regex]::Match($cargoToml, '(?ms)^\[package\].*?^version\s*=\s*"([^"]+)"')
          if (-not $match.Success) {
            throw 'Could not read the package version from Cargo.toml'
          }
          $version = $match.Groups[1].Value
          $tag = $env:GITHUB_REF_NAME
          if ($tag -cne "v$version") {
            throw "Tag '$tag' does not match Cargo.toml version '$version'; expected tag 'v$version'"
          }
          Write-Host "Releasing version $version from tag $tag"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build release binary
        run: cargo build --release --locked

      - name: Build Java bridge
        run: pwsh ./scripts/build-java-bridge.ps1

      - name: Verify version consistency and artifacts
        run: pwsh ./scripts/verify-version.ps1 -RequireArtifacts

      - name: Authenticate the release signer with Azure OIDC
        if: env.WINDOWS_RELEASE_SIGNING == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign the Windows executable
        if: env.WINDOWS_RELEASE_SIGNING == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: https://wus2.codesigning.azure.net/
          signing-account-name: jayyanez-signing
          certificate-profile-name: windows-apps
          files: ${{ github.workspace }}\target\release\wrapper.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify Windows signing before packaging
        shell: pwsh
        run: |
          ./scripts/verify-windows-signature.ps1 -FilePath 'target/release/wrapper.exe' -AllowUnsigned:($env:WINDOWS_RELEASE_SIGNING -ne 'true')

      - name: Generate the CycloneDX SBOM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo install cargo-cyclonedx --locked
          $name = "java-service-steward-${{ steps.version.outputs.version }}-windows-x64.cdx"
          cargo cyclonedx --format json --spec-version 1.5 --target x86_64-pc-windows-msvc --override-filename $name
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Move-Item -LiteralPath "$name.json" -Destination (Join-Path 'dist' "$name.json")

      - name: Stage, zip, and hash the release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.version }}'
          $name = "java-service-steward-$version-windows-x64"
          $dist = Join-Path (Get-Location) 'dist'
          $stage = Join-Path $dist $name
          New-Item -ItemType Directory -Path (Join-Path $stage 'examples') -Force | Out-Null

          $rootFiles = @(
            'target/release/wrapper.exe',
            'target/release/wrapper.jar',
            'LICENSE-APACHE',
            'LICENSE-MIT',
            'NOTICE',
            'THIRD_PARTY_NOTICES.md',
            'README.md'
          )
          foreach ($file in $rootFiles) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Required release file is missing: $file"
            }
            Copy-Item -LiteralPath $file -Destination $stage
          }
          Copy-Item -LiteralPath 'examples/wrapper.conf.example' -Destination (Join-Path $stage 'examples')

          $zip = Join-Path $dist "$name.zip"
          Compress-Archive -Path $stage -DestinationPath $zip -CompressionLevel Optimal

          # Validate the file users will receive, not only the pre-ZIP input.
          $extracted = Join-Path $env:RUNNER_TEMP 'jss-release-verification'
          Expand-Archive -LiteralPath $zip -DestinationPath $extracted
          $extractedExe = Join-Path $extracted "$name/wrapper.exe"
          ./scripts/verify-windows-signature.ps1 -FilePath $extractedExe -AllowUnsigned:($env:WINDOWS_RELEASE_SIGNING -ne 'true')
          if ((Get-FileHash -LiteralPath $extractedExe).Hash -cne (Get-FileHash -LiteralPath 'target/release/wrapper.exe').Hash) {
            throw 'The packaged executable differs from the verified build'
          }

          $sums = Join-Path $dist 'SHA256SUMS'
          $lines = foreach ($artifact in @("$name.zip", "$name.cdx.json")) {
            $hash = (Get-FileHash -LiteralPath (Join-Path $dist $artifact) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $artifact"
          }
          [System.IO.File]::WriteAllText($sums, (($lines -join "`n") + "`n"), [System.Text.UTF8Encoding]::new($false))

          Write-Host "Release contents:"
          Get-ChildItem -LiteralPath $stage -Recurse -File | ForEach-Object { Write-Host "  $($_.FullName.Substring($stage.Length + 1))" }
          Write-Host "SHA256SUMS:"
          Get-Content -LiteralPath $sums

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/java-service-steward-${{ steps.version.outputs.version }}-windows-x64.zip
            dist/java-service-steward-${{ steps.version.outputs.version }}-windows-x64.cdx.json
            dist/SHA256SUMS

      - name: Attest the SBOM of the release archive
        uses: actions/attest@v4
        with:
          subject-path: dist/java-service-steward-${{ steps.version.outputs.version }}-windows-x64.zip
          sbom-path: dist/java-service-steward-${{ steps.version.outputs.version }}-windows-x64.cdx.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Java Service Steward ${{ steps.version.outputs.version }}
          files: |
            dist/java-service-steward-${{ steps.version.outputs.version }}-windows-x64.zip
            dist/java-service-steward-${{ steps.version.outputs.version }}-windows-x64.cdx.json
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Windows Authenticode signing enabled: ${{ env.WINDOWS_RELEASE_SIGNING }}.
            When enabled, wrapper.exe is signed by Jay Yanez using Microsoft Azure Artifact Signing.
            wrapper.jar is not JAR-signed. See docs/release.md for verification instructions.

      # crates.io publication runs only when the repository defines the
      # CARGO_REGISTRY_TOKEN secret, so forks can cut releases without it.
      - name: Check for a crates.io token
        id: crate_token
        shell: pwsh
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          $present = if ([string]::IsNullOrEmpty($env:CARGO_REGISTRY_TOKEN)) { 'false' } else { 'true' }
          "present=$present" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish the crate to crates.io
        if: steps.crate_token.outputs.present == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  validate-signing:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'jayyanez/java-service-steward'
    name: Validate Windows signing without publishing
    runs-on: windows-latest
    environment: release-signing
    permissions:
      contents: read
      id-token: write
    env:
      VALIDATION_SIGNING: ${{ inputs.sign && vars.WINDOWS_CODE_SIGNING_ENABLED != '0' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: Swatinem/rust-cache@v2

      - name: Build the real application and Java bridge
        shell: pwsh
        run: |
          # A previous cache must not turn an OFF validation into a signed build.
          if (Test-Path -LiteralPath 'target/release/wrapper.exe') {
            Remove-Item -LiteralPath 'target/release/wrapper.exe' -Force
          }
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
          ./scripts/build-java-bridge.ps1
          ./scripts/verify-version.ps1 -RequireArtifacts

      - name: Authenticate the validation signer
        if: env.VALIDATION_SIGNING == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign one validation executable
        if: env.VALIDATION_SIGNING == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: https://wus2.codesigning.azure.net/
          signing-account-name: jayyanez-signing
          certificate-profile-name: windows-apps
          files: ${{ github.workspace }}\target\release\wrapper.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify, package, and reverify the validation build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path 'dist/validation' -Force | Out-Null
          ./scripts/verify-windows-signature.ps1 -FilePath 'target/release/wrapper.exe' -AllowUnsigned:($env:VALIDATION_SIGNING -ne 'true') -OutputPath 'dist/signing-receipt.json'
          Copy-Item -LiteralPath 'target/release/wrapper.exe','target/release/wrapper.jar' -Destination 'dist/validation'
          'Internal signing validation build; not a public application release.' | Set-Content -LiteralPath 'dist/validation/VALIDATION.txt'
          Compress-Archive -LiteralPath 'dist/validation' -DestinationPath 'dist/signing-validation.zip'
          $extracted = Join-Path $env:RUNNER_TEMP 'jss-validation-extracted'
          Expand-Archive -LiteralPath 'dist/signing-validation.zip' -DestinationPath $extracted
          ./scripts/verify-windows-signature.ps1 -FilePath (Join-Path $extracted 'validation/wrapper.exe') -AllowUnsigned:($env:VALIDATION_SIGNING -ne 'true')
          (Get-FileHash -LiteralPath 'dist/signing-validation.zip' -Algorithm SHA256).Hash | Set-Content -LiteralPath 'dist/SHA256.txt'

      - name: Upload the validation build and signature receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signing-validation-${{ github.run_id }}
          path: |
            dist/signing-validation.zip
            dist/signing-receipt.json
            dist/SHA256.txt
          retention-days: 3
