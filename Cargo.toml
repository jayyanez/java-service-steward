[package]
name = "java-service-steward"
version = "0.3.2"
edition = "2024"
rust-version = "1.88"
description = "Runs, controls, and monitors Java applications as Windows services; reads wrapper.conf-style configuration files"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/jayyanez/java-service-steward"
homepage = "https://github.com/jayyanez/java-service-steward"
readme = "README.md"
keywords = ["windows-service", "java", "service-wrapper", "supervisor"]
categories = ["command-line-utilities"]
publish = false

[[bin]]
name = "wrapper"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.41", default-features = false, features = ["clock"] }
crossbeam-channel = "0.5.15"
ctrlc = "3.4.7"
encoding_rs = "0.8.35"
getrandom = "0.3.3"
thiserror = "2.0.12"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.0"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_EventLog",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
